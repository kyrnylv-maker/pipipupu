<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Telegram Web Clone - Полнофункциональный мессенджер">
    <meta name="theme-color" content="#3390ec">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Telegram">
    
    <title>Telegram Web</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/public/manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/public/styles.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'tg-primary': '#3390ec',
                        'tg-dark-bg': '#212121',
                        'tg-dark-secondary': '#181818',
                        'tg-dark-chat': '#0e0e0e',
                        'tg-light-bg': '#ffffff',
                        'tg-light-secondary': '#f4f4f5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tg-light-secondary dark:bg-tg-dark-bg transition-colors">
    <div id="app"></div>
    
    <!-- Scripts -->
    <script>
        // API Configuration
        const API_URL = 'https://pipipupu-production.up.railway.app';
        const WS_URL = 'wss://pipipupu-production.up.railway.app';

        // Global State
        const state = {
            user: null,
            token: null,
            currentChat: null,
            chats: [],
            messages: {},
            ws: null,
            theme: localStorage.getItem('theme') || 'light',
            currentView: 'auth',
            folders: ['Все', 'Чаты', 'Каналы'],
            activeFolder: 'Все',
            contacts: [],
            channels: [],
            onlineUsers: new Set(),
            typingUsers: new Map()
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            await checkBackendAvailability();
            checkAuth();
            render();
        });

        // Check if backend is available
        async function checkBackendAvailability() {
            try {
                const response = await fetch(`${API_URL}/health`, { 
                    method: 'GET',
                    mode: 'cors'
                });
                console.log('✅ Backend is available');
            } catch (error) {
                console.warn('⚠️ Backend is not available, enabling mock mode');
                console.warn('Error:', error.message);
                
                // Автоматически включаем mock режим если бэкенд недоступен
                if (!localStorage.getItem('mockMode')) {
                    const enableMock = confirm(
                        'Бэкенд недоступен. Включить режим тестирования с демо-данными?'
                    );
                    if (enableMock) {
                        localStorage.setItem('mockMode', 'true');
                        location.reload();
                    }
                }
            }
        }

        // Theme Management
        function initTheme() {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', state.theme);
            initTheme();
        }

        // Authentication Check
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                state.token = token;
                state.user = JSON.parse(user);
                state.currentView = 'messenger';
                connectWebSocket();
                loadChats();
            } else {
                state.currentView = 'auth';
            }
        }

        // WebSocket Connection
        function connectWebSocket() {
            if (!state.token) return;
            
            state.ws = new WebSocket(`${WS_URL}?token=${state.token}`);
            
            state.ws.onopen = () => {
                console.log('WebSocket connected');
            };
            
            state.ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
            
            state.ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            state.ws.onclose = () => {
                console.log('WebSocket disconnected');
                setTimeout(() => {
                    if (state.token) connectWebSocket();
                }, 3000);
            };
        }

        function handleWebSocketMessage(data) {
            switch(data.type) {
                case 'message':
                    handleNewMessage(data.payload);
                    break;
                case 'user_online':
                    state.onlineUsers.add(data.userId);
                    render();
                    break;
                case 'user_offline':
                    state.onlineUsers.delete(data.userId);
                    render();
                    break;
                case 'typing':
                    handleTyping(data);
                    break;
                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        function handleNewMessage(message) {
            const chatId = message.chatId || message.channelId;
            if (!state.messages[chatId]) {
                state.messages[chatId] = [];
            }
            state.messages[chatId].push(message);
            
            const chatIndex = state.chats.findIndex(c => c.id === chatId);
            if (chatIndex !== -1) {
                state.chats[chatIndex].lastMessage = message;
                state.chats[chatIndex].timestamp = message.timestamp;
                const chat = state.chats.splice(chatIndex, 1)[0];
                state.chats.unshift(chat);
            }
            
            render();
            scrollToBottom();
        }

        function handleTyping(data) {
            const { chatId, userId, isTyping } = data;
            if (isTyping) {
                state.typingUsers.set(chatId, userId);
            } else {
                state.typingUsers.delete(chatId);
            }
            render();
        }

        // API Calls
        async function apiCall(endpoint, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (state.token) {
                headers['Authorization'] = `Bearer ${state.token}`;
            }
            
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    ...options,
                    headers
                });
                
                // Получаем текст ответа
                const text = await response.text();
                console.log('API Response:', { status: response.status, text });
                
                // Пытаемся распарсить JSON
                let data;
                try {
                    data = text ? JSON.parse(text) : {};
                } catch (e) {
                    console.error('Failed to parse JSON:', text);
                    throw new Error(`Сервер вернул некорректный ответ: ${text.substring(0, 100)}`);
                }
                
                if (!response.ok) {
                    throw new Error(data.message || data.error || `HTTP ${response.status}`);
                }
                
                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        async function login(username, password) {
            // Mock mode
            if (localStorage.getItem('mockMode') === 'true') {
                console.log('🧪 Mock mode: Login');
                state.token = 'mock-token-' + Date.now();
                state.user = {
                    id: 'user-1',
                    username: username,
                    displayName: username,
                    avatar: null
                };
                localStorage.setItem('token', state.token);
                localStorage.setItem('user', JSON.stringify(state.user));
                
                state.currentView = 'messenger';
                loadMockChats();
                render();
                return;
            }

            try {
                const data = await apiCall('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                
                state.token = data.token;
                state.user = data.user;
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                state.currentView = 'messenger';
                connectWebSocket();
                loadChats();
                render();
            } catch (error) {
                alert('Ошибка входа: ' + error.message);
            }
        }

        async function register(username, password, displayName) {
            // Mock mode
            if (localStorage.getItem('mockMode') === 'true') {
                console.log('🧪 Mock mode: Register');
                state.token = 'mock-token-' + Date.now();
                state.user = {
                    id: 'user-1',
                    username: username,
                    displayName: displayName || username,
                    avatar: null
                };
                localStorage.setItem('token', state.token);
                localStorage.setItem('user', JSON.stringify(state.user));
                
                state.currentView = 'messenger';
                loadMockChats();
                render();
                return;
            }

            try {
                const data = await apiCall('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, displayName })
                });
                
                state.token = data.token;
                state.user = data.user;
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                state.currentView = 'messenger';
                connectWebSocket();
                loadChats();
                render();
            } catch (error) {
                alert('Ошибка регистрации: ' + error.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            if (state.ws) state.ws.close();
            state.token = null;
            state.user = null;
            state.currentView = 'auth';
            state.chats = [];
            state.messages = {};
            render();
        }

        async function loadChats() {
            try {
                const data = await apiCall('/api/chats');
                state.chats = data.chats || [];
                render();
            } catch (error) {
                console.error('Error loading chats:', error);
            }
        }

        async function loadMessages(chatId) {
            try {
                const data = await apiCall(`/api/chats/${chatId}/messages`);
                state.messages[chatId] = data.messages || [];
                render();
                scrollToBottom();
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage(text, attachments = []) {
            if (!state.currentChat || !text.trim()) return;
            
            // Mock mode
            if (localStorage.getItem('mockMode') === 'true') {
                const chatId = state.currentChat.id;
                if (!state.messages[chatId]) {
                    state.messages[chatId] = [];
                }
                
                const message = {
                    id: 'msg-' + Date.now(),
                    chatId: chatId,
                    senderId: state.user.id,
                    senderName: state.user.displayName,
                    text: text,
                    timestamp: new Date().toISOString(),
                    read: false,
                    reactions: {},
                    attachments: attachments
                };
                
                state.messages[chatId].push(message);
                state.currentChat.lastMessage = message;
                render();
                scrollToBottom();
                return;
            }
            
            try {
                await apiCall(`/api/chats/${state.currentChat.id}/messages`, {
                    method: 'POST',
                    body: JSON.stringify({ text, attachments })
                });
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Ошибка отправки сообщения');
            }
        }

        // Mock Data Functions
        function loadMockChats() {
            state.chats = [
                {
                    id: 'chat-1',
                    name: 'Демо Чат',
                    username: 'demo_chat',
                    avatar: null,
                    isChannel: false,
                    userId: 'user-demo',
                    lastMessage: {
                        text: 'Привет! Это демонстрационный режим',
                        timestamp: new Date().toISOString(),
                        senderId: 'user-demo'
                    },
                    timestamp: new Date().toISOString(),
                    unreadCount: 0
                },
                {
                    id: 'chat-2',
                    name: 'Тестовый Канал',
                    username: 'test_channel',
                    avatar: null,
                    isChannel: true,
                    subscribersCount: 100,
                    lastMessage: {
                        text: 'Добро пожаловать в тестовый режим!',
                        timestamp: new Date(Date.now() - 3600000).toISOString(),
                        senderId: 'admin-1'
                    },
                    timestamp: new Date(Date.now() - 3600000).toISOString(),
                    unreadCount: 0
                }
            ];
            
            // Добавляем начальные сообщения
            state.messages['chat-1'] = [
                {
                    id: 'msg-demo-1',
                    chatId: 'chat-1',
                    senderId: 'user-demo',
                    senderName: 'Демо Пользователь',
                    text: 'Привет! Это демонстрационный режим.',
                    timestamp: new Date(Date.now() - 300000).toISOString(),
                    read: true,
                    reactions: {}
                },
                {
                    id: 'msg-demo-2',
                    chatId: 'chat-1',
                    senderId: 'user-demo',
                    senderName: 'Демо Пользователь',
                    text: 'Вы можете отправлять сообщения и они будут сохраняться локально.',
                    timestamp: new Date(Date.now() - 240000).toISOString(),
                    read: true,
                    reactions: {}
                },
                {
                    id: 'msg-demo-3',
                    chatId: 'chat-1',
                    senderId: 'user-demo',
                    senderName: 'Демо Пользователь',
                    text: 'Чтобы подключиться к реальному бэкенду, выключите mock режим:\nlocalStorage.removeItem("mockMode"); location.reload();',
                    timestamp: new Date(Date.now() - 180000).toISOString(),
                    read: true,
                    reactions: {}
                }
            ];
        }

        async function loadMessages(chatId) {
            // Mock mode
            if (localStorage.getItem('mockMode') === 'true') {
                // Сообщения уже загружены в loadMockChats
                render();
                scrollToBottom();
                return;
            }

            try {
                const data = await apiCall(`/api/chats/${chatId}/messages`);
                state.messages[chatId] = data.messages || [];
                render();
                scrollToBottom();
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Helper Functions
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'только что';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' мин';
            if (diff < 86400000) return date.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
            if (diff < 604800000) return date.toLocaleDateString('ru', { weekday: 'short' });
            return date.toLocaleDateString('ru', { day: 'numeric', month: 'short' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById('messages-container');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, 100);
        }

        // Render Functions
        function render() {
            const app = document.getElementById('app');
            
            if (state.currentView === 'auth') {
                app.innerHTML = renderAuthView();
                attachAuthListeners();
            } else if (state.currentView === 'messenger') {
                app.innerHTML = renderMessengerView();
                attachMessengerListeners();
            }
        }

        function renderAuthView() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600 p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto mb-4 flex items-center justify-center">
                                <span class="material-icons text-white text-4xl">telegram</span>
                            </div>
                            <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Telegram Web</h1>
                            <p class="text-gray-600 dark:text-gray-400">Войдите или зарегистрируйтесь</p>
                        </div>
                        
                        <div id="auth-tabs" class="flex mb-6 bg-gray-100 dark:bg-gray-700 rounded-lg p-1">
                            <button class="auth-tab flex-1 py-2 rounded-md transition-all font-medium bg-white dark:bg-gray-800 text-blue-500" data-tab="login">
                                Вход
                            </button>
                            <button class="auth-tab flex-1 py-2 rounded-md transition-all font-medium" data-tab="register">
                                Регистрация
                            </button>
                        </div>
                        
                        <div id="login-form" class="auth-form">
                            <div class="space-y-4">
                                <input type="text" id="login-username" placeholder="Логин" 
                                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-blue-500 transition-colors">
                                <input type="password" id="login-password" placeholder="Пароль" 
                                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-blue-500 transition-colors">
                                <button id="login-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-medium transition-colors">
                                    Войти
                                </button>
                            </div>
                        </div>
                        
                        <div id="register-form" class="auth-form hidden">
                            <div class="space-y-4">
                                <input type="text" id="register-name" placeholder="Имя" 
                                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-blue-500 transition-colors">
                                <input type="text" id="register-username" placeholder="Логин (@username)" 
                                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-blue-500 transition-colors">
                                <input type="password" id="register-password" placeholder="Пароль" 
                                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-blue-500 transition-colors">
                                <button id="register-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-medium transition-colors">
                                    Зарегистрироваться
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMessengerView() {
            return `
                <div class="h-screen flex overflow-hidden bg-gray-50 dark:bg-gray-900">
                    <div class="w-full md:w-96 border-r border-gray-200 dark:border-gray-700 flex flex-col bg-white dark:bg-gray-800">
                        <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-xl font-bold dark:text-white">Telegram</h2>
                                <div class="flex gap-2">
                                    <button onclick="toggleTheme()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                                        <span class="material-icons text-gray-600 dark:text-gray-300">
                                            ${state.theme === 'dark' ? 'light_mode' : 'dark_mode'}
                                        </span>
                                    </button>
                                    <button onclick="logout()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                                        <span class="material-icons text-gray-600 dark:text-gray-300">logout</span>
                                    </button>
                                </div>
                            </div>
                            <input type="text" placeholder="Поиск" 
                                class="w-full px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-lg dark:text-white">
                        </div>
                        
                        <div class="flex-1 overflow-y-auto">
                            ${state.chats.length === 0 ? `
                                <div class="flex flex-col items-center justify-center h-full text-gray-500 dark:text-gray-400 p-8 text-center">
                                    <span class="material-icons text-6xl mb-4 opacity-50">chat_bubble_outline</span>
                                    <p>Нет чатов</p>
                                </div>
                            ` : state.chats.map(chat => `
                                <div class="chat-item p-4 flex items-center gap-3 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer ${state.currentChat?.id === chat.id ? 'bg-blue-500 text-white' : ''}" data-chat-id="${chat.id}">
                                    <div class="avatar w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center text-white font-semibold flex-shrink-0">
                                        ${getInitials(chat.name)}
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-medium truncate">${chat.name}</h3>
                                        <p class="text-sm truncate opacity-70">${chat.lastMessage?.text || 'Нет сообщений'}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="flex-1 flex flex-col">
                        ${state.currentChat ? renderChatView() : `
                            <div class="flex flex-col items-center justify-center h-full text-gray-500 dark:text-gray-400">
                                <span class="material-icons text-8xl mb-4 opacity-30">chat_bubble_outline</span>
                                <h2 class="text-2xl font-medium mb-2">Выберите чат</h2>
                                <p class="text-center">Выберите чат из списка</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderChatView() {
            const chat = state.currentChat;
            const messages = state.messages[chat.id] || [];
            
            return `
                <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="avatar w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-semibold">
                            ${getInitials(chat.name)}
                        </div>
                        <div>
                            <h2 class="font-medium dark:text-white">${chat.name}</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400">онлайн</p>
                        </div>
                    </div>
                </div>
                
                <div id="messages-container" class="flex-1 overflow-y-auto p-4 bg-gray-50 dark:bg-gray-900">
                    ${messages.length === 0 ? `
                        <div class="flex flex-col items-center justify-center h-full text-gray-500 dark:text-gray-400">
                            <span class="material-icons text-6xl mb-4 opacity-50">chat</span>
                            <p>Начните переписку</p>
                        </div>
                    ` : messages.map(msg => {
                        const isSent = msg.senderId === state.user?.id;
                        return `
                            <div class="flex ${isSent ? 'justify-end' : 'justify-start'} mb-4">
                                <div class="max-w-[65%] ${isSent ? 'bg-blue-500 text-white' : 'bg-white dark:bg-gray-800 dark:text-white'} rounded-lg p-3">
                                    <p class="text-sm whitespace-pre-wrap">${escapeHtml(msg.text)}</p>
                                    <div class="flex items-center justify-end gap-1 mt-1">
                                        <span class="text-xs opacity-70">${formatTime(msg.timestamp)}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                
                <div class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                    <div class="flex items-end gap-2">
                        <textarea id="message-input" placeholder="Написать сообщение..." 
                            class="flex-1 px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 dark:text-white border-none resize-none focus:ring-2 focus:ring-blue-500 max-h-32"
                            rows="1"></textarea>
                        <button id="send-btn" class="p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg">
                            <span class="material-icons">send</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // Event Listeners
        function attachAuthListeners() {
            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const authTabs = document.querySelectorAll('.auth-tab');
            
            authTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.dataset.tab;
                    authTabs.forEach(t => {
                        t.classList.remove('bg-white', 'dark:bg-gray-800', 'text-blue-500');
                    });
                    tab.classList.add('bg-white', 'dark:bg-gray-800', 'text-blue-500');
                    
                    document.querySelectorAll('.auth-form').forEach(form => form.classList.add('hidden'));
                    document.getElementById(`${targetTab}-form`).classList.remove('hidden');
                });
            });
            
            if (loginBtn) {
                loginBtn.addEventListener('click', () => {
                    const username = document.getElementById('login-username').value;
                    const password = document.getElementById('login-password').value;
                    if (username && password) {
                        login(username, password);
                    }
                });
            }
            
            if (registerBtn) {
                registerBtn.addEventListener('click', () => {
                    const name = document.getElementById('register-name').value;
                    const username = document.getElementById('register-username').value;
                    const password = document.getElementById('register-password').value;
                    if (name && username && password) {
                        register(username, password, name);
                    }
                });
            }

            // Enter key support
            document.querySelectorAll('#login-form input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') loginBtn?.click();
                });
            });
            
            document.querySelectorAll('#register-form input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') registerBtn?.click();
                });
            });
        }

        function attachMessengerListeners() {
            document.querySelectorAll('.chat-item').forEach(item => {
                item.addEventListener('click', () => {
                    const chatId = item.dataset.chatId;
                    const chat = state.chats.find(c => c.id === chatId);
                    if (chat) {
                        state.currentChat = chat;
                        loadMessages(chatId);
                    }
                });
            });
            
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            
            if (messageInput) {
                messageInput.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 128) + 'px';
                });
                
                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendBtn?.click();
                    }
                });
            }
            
            if (sendBtn) {
                sendBtn.addEventListener('click', () => {
                    const text = messageInput?.value.trim();
                    if (text) {
                        sendMessage(text);
                        messageInput.value = '';
                        messageInput.style.height = 'auto';
                    }
                });
            }
        }
    </script>
</body>
</html>
