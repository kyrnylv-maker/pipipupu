<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoChat - Крутой Мессенджер</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --chat-bg: #0f172a;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --msg-received: #1e293b;
            --msg-sent: #3b82f6;
            --accent: #8b5cf6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* --- Экран авторизации --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .auth-box {
            background-color: var(--sidebar-bg); padding: 40px; border-radius: 20px;
            text-align: center; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .auth-box h2 { color: var(--primary); margin-bottom: 10px; }
        
        .auth-avatar-picker {
            width: 100px; height: 100px; border-radius: 50%; background-color: var(--border-color);
            display: flex; justify-content: center; align-items: center; font-size: 30px; color: var(--text-muted);
            cursor: pointer; overflow: hidden; position: relative; border: 3px solid var(--primary);
        }
        .auth-avatar-picker img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .auth-avatar-picker:hover::after {
            content: "Изменить"; position: absolute; background: rgba(0,0,0,0.6);
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 14px;
        }

        .auth-box input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--bg-color); color: var(--text-main); outline: none;
        }
        .auth-box button {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background-color: var(--primary); color: white; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        .auth-box button:hover { background-color: var(--primary-hover); }

        /* --- Боковая панель --- */
        .sidebar { width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .user-profile { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .user-info h3 { font-size: 16px; font-weight: 600; }
        .user-info p { font-size: 13px; color: var(--text-muted); }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; cursor: pointer; transition: 0.2s; background-color: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--primary); }
        .chat-avatar { width: 45px; height: 45px; border-radius: 50%; background-color: var(--accent); display: flex; justify-content: center; align-items: center; font-size: 20px;}
        .chat-details { flex: 1; }
        .chat-header h4 { font-size: 15px; }

        /* --- Зона чата --- */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: var(--chat-bg); }
        .current-chat-header { padding: 20px; background-color: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .current-chat-info { display: flex; align-items: center; gap: 15px; }
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* Обновленный дизайн сообщений с аватарками */
        .message-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .message-wrapper.received { flex-direction: row; }
        .message-wrapper.sent { flex-direction: row-reverse; }
        
        .msg-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background-color: var(--border-color); }
        
        .message { max-width: 65%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.4; position: relative; word-wrap: break-word;}
        .message.received { background-color: var(--msg-received); border-bottom-left-radius: 5px; }
        .message.sent { background-color: var(--msg-sent); border-bottom-right-radius: 5px; }
        
        .sender-name { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 5px; display: block; }
        .message-time { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 5px; text-align: right; display: block; }

        /* Изображения в чате */
        .message img.chat-image { max-width: 100%; border-radius: 10px; margin-top: 5px; cursor: pointer; }

        /* --- Ввод текста --- */
        .chat-input-area { padding: 20px; background-color: var(--sidebar-bg); border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; }
        .chat-input-area input[type="text"] { flex: 1; padding: 15px; border-radius: 25px; border: none; background-color: var(--bg-color); color: var(--text-main); outline: none; font-size: 15px;}
        
        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); }
        
        .send-btn { background-color: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .send-btn:hover { background-color: var(--primary-hover); transform: scale(1.05); }
        .send-btn:disabled, .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <input type="file" id="auth-avatar-input" accept="image/*" style="display: none;">
    <input type="file" id="chat-image-input" accept="image/*" style="display: none;">

    <div id="auth-screen">
        <div class="auth-box">
            <h2>NeoChat</h2>
            <p style="font-size: 14px; color: var(--text-muted);">Создайте свой профиль</p>
            
            <div class="auth-avatar-picker" id="avatar-picker-btn">
                <i class="fa-solid fa-camera" id="auth-cam-icon"></i>
                <img id="auth-avatar-preview" src="">
            </div>

            <input type="text" id="username-input" placeholder="Ваш никнейм..." autocomplete="off">
            <button id="login-btn">Войти в чат</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="user-profile">
            <img src="" alt="Аватар" class="avatar" id="my-avatar" style="background: #334155;">
            <div class="user-info">
                <h3 id="display-username">Гость</h3>
                <p style="color: #4ade80;">В сети</p>
            </div>
        </div>
        <div class="chat-list">
            <div class="chat-item">
                <div class="chat-avatar"><i class="fa-solid fa-globe"></i></div>
                <div class="chat-details">
                    <div class="chat-header"><h4>Глобальный чат</h4></div>
                </div>
            </div>
        </div>
    </aside>

    <main class="chat-area">
        <div class="current-chat-header">
            <div class="current-chat-info">
                <div class="chat-avatar"><i class="fa-solid fa-globe"></i></div>
                <div>
                    <h3 style="font-size: 16px;">Глобальный чат</h3>
                    <p style="font-size: 13px; color: var(--text-muted);" id="connection-status">Ожидание подключения...</p>
                </div>
            </div>
        </div>

        <div class="messages-container" id="chat-box"></div>

        <div class="chat-input-area">
            <button class="icon-btn" id="attach-btn" disabled><i class="fa-solid fa-paperclip"></i></button>
            <input type="text" id="message-input" placeholder="Напишите сообщение..." disabled>
            <button class="send-btn" id="send-btn" disabled><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </main>

    <script>
        let socket;
        let myProfile = {
            username: "",
            avatar: "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png" // Дефолтная картинка
        };

        // --- Утилита: Сжатие картинок перед отправкой ---
        // Чтобы сервер не "упал" от фото на 10 мегабайт, мы уменьшаем их размер прямо в браузере
        function compressImage(file, maxSize, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height && width > maxSize) {
                        height *= maxSize / width; width = maxSize;
                    } else if (height > maxSize) {
                        width *= maxSize / height; height = maxSize;
                    }
                    
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); // Сжимаем до 60% качества
                }
            }
        }

        // --- Логика экрана авторизации ---
        const authAvatarInput = document.getElementById('auth-avatar-input');
        const authAvatarPreview = document.getElementById('auth-avatar-preview');
        const authCamIcon = document.getElementById('auth-cam-icon');

        document.getElementById('avatar-picker-btn').addEventListener('click', () => authAvatarInput.click());

        authAvatarInput.addEventListener('change', function(e) {
            if (e.target.files[0]) {
                compressImage(e.target.files[0], 200, (base64Img) => {
                    myProfile.avatar = base64Img;
                    authAvatarPreview.src = base64Img;
                    authAvatarPreview.style.display = 'block';
                    authCamIcon.style.display = 'none';
                });
            }
        });

        const loginBtn = document.getElementById('login-btn');
        const usernameInput = document.getElementById('username-input');

        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name.length > 0) {
                myProfile.username = name;
                document.getElementById('display-username').textContent = name;
                document.getElementById('my-avatar').src = myProfile.avatar;
                
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('auth-screen').style.display = 'none', 500);
                
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('attach-btn').disabled = false;

                connectToServer();
            } else {
                alert("Пожалуйста, введите имя!");
            }
        });

        // --- Подключение и WebSockets ---
        function connectToServer() {
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = wsProtocol + '//' + window.location.host + '/ws';
            
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                document.getElementById('connection-status').textContent = "Подключено, live режим 🟢";
                document.getElementById('connection-status').style.color = "#4ade80";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                displayMessage(data);
            };

            socket.onclose = () => {
                document.getElementById('connection-status').textContent = "Соединение разорвано 🔴";
                document.getElementById('connection-status').style.color = "#ef4444";
            };
        }

        // --- Отрисовка сообщений ---
        const chatBox = document.getElementById('chat-box');

        function displayMessage(data) {
            const isMe = (data.username === myProfile.username);
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isMe ? 'sent' : 'received'}`;
            
            // Создаем аватарку
            const avatarImg = document.createElement('img');
            avatarImg.className = 'msg-avatar';
            avatarImg.src = data.avatar;

            // Создаем само сообщение
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
            
            let htmlContent = '';
            if (!isMe) {
                htmlContent += `<span class="sender-name">${data.username}</span>`;
            }

            // Проверяем тип: текст или картинка
            if (data.type === 'image') {
                htmlContent += `<img src="${data.content}" class="chat-image">`;
            } else {
                htmlContent += `${data.content}`;
            }

            htmlContent += `<span class="message-time">${data.time}</span>`;
            msgDiv.innerHTML = htmlContent;

            // Собираем всё вместе
            wrapper.appendChild(avatarImg);
            wrapper.appendChild(msgDiv);

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight; // Автоскролл
        }

        // --- Отправка сообщений (Текст) ---
        const messageInput = document.getElementById('message-input');
        
        function sendTextMessage() {
            const text = messageInput.value.trim();
            if (text !== "" && socket.readyState === WebSocket.OPEN) {
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                const payload = {
                    username: myProfile.username,
                    avatar: myProfile.avatar,
                    type: "text",
                    content: text,
                    time: timeStr
                };

                socket.send(JSON.stringify(payload));
                messageInput.value = '';
            }
        }

        document.getElementById('send-btn').addEventListener('click', sendTextMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTextMessage(); });
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginBtn.click(); });

        // --- Отправка сообщений (Картинка) ---
        const chatImageInput = document.getElementById('chat-image-input');
        document.getElementById('attach-btn').addEventListener('click', () => chatImageInput.click());

        chatImageInput.addEventListener('change', function(e) {
            if (e.target.files[0] && socket.readyState === WebSocket.OPEN) {
                // Сжимаем фото для чата до 800px
                compressImage(e.target.files[0], 800, (base64Img) => {
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                    const payload = {
                        username: myProfile.username,
                        avatar: myProfile.avatar,
                        type: "image",
                        content: base64Img,
                        time: timeStr
                    };

                    socket.send(JSON.stringify(payload));
                    chatImageInput.value = ''; // Очищаем инпут
                });
            }
        });
    </script>
</body>
</html>
